<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="별무리 고등학교 친구들과 즐기는 텍스트 축구 게임"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>html{color-scheme:light}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>별무리 FC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a match-day notebook. Text first, a 4-cell pitch strip is the only "graphic". */
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --fg:#151A17; --muted:#69726B; --line:#DCE0D8;
  --accent:#2C7A4B; --accent-soft:#E3EFE6; --pitch:#E2ECE3; --pitch-line:#B3C8B8; --danger:#B9442F; --danger-soft:#F6E4DF; --gold:#9A7A1E;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1311; --surface:#171C19; --fg:#E7ECE8; --muted:#8C968F; --line:#28302B;
  --accent:#62C08A; --accent-soft:#1A2E22; --pitch:#15241B; --pitch-line:#2F4A39; --danger:#E5775F; --danger-soft:#33201B; --gold:#D6B44E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#171C19; --fg:#E7ECE8; --muted:#8C968F; --line:#28302B;
  --accent:#62C08A; --accent-soft:#1A2E22; --pitch:#15241B; --pitch-line:#2F4A39; --danger:#E5775F; --danger-soft:#33201B; --gold:#D6B44E; color-scheme:dark }
html,body{min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#app.wide{max-width:940px}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:6px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:none;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats>div{background:var(--surface);padding:12px}
.stats b{display:block;font-family:var(--mono);font-size:20px}
.topnav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.topnav button{background:none;border:none;padding:8px 10px 10px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.topnav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:700}
.coins{margin-left:auto;align-self:center;font-family:var(--mono);font-size:13px;color:var(--gold)}

.formpick{display:flex;flex-direction:column;gap:8px}
.fchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fchip{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left}
.fchip b{font-family:var(--mono);font-size:15px}
.fchip small{font-size:11px;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.fchip:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:480px){.fchips{grid-template-columns:repeat(2,1fr)}}

.league{display:flex;flex-direction:column;gap:10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.btn.small{padding:7px 12px;font-size:13px}
.items{display:flex;flex-direction:column;gap:8px}
.itm{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.itm div{display:flex;flex-direction:column;min-width:0}
.itm .muted{font-size:12px}
.itm.lock{opacity:.55}
.itm.own{border-color:var(--accent)}
.tagown{font-size:12px;color:var(--accent);font-weight:700}
.gen{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 4px;margin-left:4px}
.sell{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.promo{font-size:14px;font-weight:700;text-align:center;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.promo.up{color:var(--accent)} .promo.down{color:var(--danger)}
.ratings{font-size:13px;text-align:left;width:100%}
.ratings ol{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.ratings li{display:flex;justify-content:space-between;gap:8px}

/* match */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.board .t{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .t.r{text-align:right}
.board .sc{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.04em}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.pitch{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.pitch span{font-size:11px;text-align:center;padding:6px 2px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden}
.pitch span.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.pitch span.on.danger{background:var(--danger);border-color:var(--danger)}
.turn{display:flex;flex-direction:column;gap:4px;font-size:14px}
.turn p{margin:0;padding-left:10px;border-left:2px solid var(--line)}
.turn p.ok{border-color:var(--accent)} .turn p.bad{border-color:var(--danger)}
.turn p.goal{border-color:var(--gold);font-weight:700}
.turn p.them{border-color:var(--danger);font-weight:700}
.situ{font-size:19px;font-weight:700;line-height:1.4;margin:0;text-wrap:balance}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.choice:hover{border-color:var(--fg)}
.choice .lb{font-weight:700;min-width:0}
.choice .sub{grid-column:1;font-size:12px;color:var(--muted);min-width:0}
.choice .pct{grid-row:1/3;grid-column:2;font-family:var(--mono);font-size:20px;font-weight:600;text-align:right}
.choice .pct small{display:block;font-family:var(--font);font-size:11px;font-weight:500;color:var(--muted)}
.pct.hi{color:var(--accent)} .pct.lo{color:var(--danger)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.log li{display:grid;grid-template-columns:38px 1fr;gap:8px}
.log li .m{font-family:var(--mono)}
.log li.goal{color:var(--fg);font-weight:700}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.result .big{font-family:var(--mono);font-size:48px;font-weight:600}
.reward{font-family:var(--mono);color:var(--gold);font-weight:600}

/* squad */
.group{display:flex;flex-direction:column;gap:10px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pl-head{display:flex;align-items:center;gap:10px}
.pl{padding:0;gap:0}
.pl-toggle{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:12px 14px;text-align:left;border-radius:8px}
.pl-toggle:hover .pl-sum b{text-decoration:underline}
.pl-sum{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.pl-sum span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:13px;width:12px;text-align:center}
.pl.open{border-color:var(--fg)}
.pl-body{display:flex;flex-direction:column;gap:10px;padding:2px 14px 14px;border-top:1px solid var(--line);padding-top:12px;animation:rise .25s ease both}
.rename{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.rename input{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;color:var(--fg);background:transparent;border:none;border-bottom:1px dashed var(--line);padding:2px 0}
.badge{font-family:var(--mono);font-size:12px;font-weight:600;border:1px solid var(--fg);border-radius:4px;padding:1px 6px;min-width:40px;text-align:center}
.pl-head input{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--fg);background:transparent;border:none;border-bottom:1px dashed var(--line);padding:2px 0}
.ovr{font-family:var(--mono);font-size:20px;font-weight:600}
.ovr small{font-family:var(--font);font-size:11px;color:var(--muted);font-weight:500;margin-right:4px}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 10px;min-width:0}
.st .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .v{font-family:var(--mono);font-weight:600}
.st.key{border-color:var(--fg)} .st.key .n{color:var(--fg);font-weight:500}
.st:not(.key) .v{color:var(--muted)}
.up{border:1px solid var(--line);background:var(--bg);border-radius:4px;font-size:11px;padding:2px 6px;white-space:nowrap;font-family:var(--mono)}
.up:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.up:disabled{opacity:.35;cursor:not-allowed}
.bump{animation:bump .5s ease}
@keyframes bump{from{background:var(--accent-soft)}to{background:transparent}}
.teamname{font:inherit;font-size:26px;font-weight:700;line-height:1.2;color:var(--fg);background:transparent;border:none;border-bottom:1px dashed var(--line);padding:2px 0;width:100%;max-width:100%}
.savecode{display:flex;flex-direction:column;gap:8px}
.savecode summary{cursor:pointer;color:var(--fg)}
.savecode[open]{display:flex}
.savecode textarea{font-family:var(--mono);font-size:11px;width:100%;box-sizing:border-box;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical;word-break:break-all}
.savecode .btn{padding:8px 12px;font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.mgrid>*{min-width:0}
.pitchwrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.field{width:100%;max-width:250px;height:auto;display:block}
.field .pl-g{transition:transform .5s ease}
.field text{font-family:var(--font);text-anchor:middle;dominant-baseline:central}
.field .nm{font-size:2.5px;font-weight:700;fill:var(--fg);paint-order:stroke;stroke:var(--pitch);stroke-width:.9px}
.field .ps{font-size:1.9px;font-weight:700;fill:var(--bg);font-family:var(--mono)}
.field .dot{fill:var(--fg)}
.field .pl-g.has .dot{fill:var(--accent)}
.field .pl-g.has .nm{fill:var(--accent)}
.field .opp{fill:var(--danger)}
.field .pl-g.mark .dot{stroke:var(--danger);stroke-width:.9}
.field .pl-g.off{opacity:.3}
.field .yc{fill:#E5B31E;stroke:var(--fg);stroke-width:.15}
.field .ball{fill:var(--surface);stroke:var(--fg);stroke-width:.35}
.field [data-jump]{cursor:pointer}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media (min-width:760px){
  .mgrid{grid-template-columns:300px minmax(0,1fr);gap:32px}
  .mgrid .pitchwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .field{max-width:300px}
  .sqgrid{grid-template-columns:340px minmax(0,1fr)}
  .sqgrid .pitchwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .sqgrid .field{max-width:340px}
}
.sqgrid{display:grid;gap:24px;align-items:start}
.sqgrid>*{min-width:0}
.sqlist{display:flex;flex-direction:column;gap:20px}
.pl.flash{animation:bump .9s ease}
@media (prefers-reduced-motion:reduce){ .field .pl-g{transition:none} }
body.fitbody{padding-block:10px}
#goalfx{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 82%,transparent);opacity:0;animation:gfxIn .35s ease var(--gd,0ms) forwards}
#goalfx.out{animation:gfxOut .3s ease forwards}
#goalfx.still{opacity:1;animation:none}
@keyframes gfxIn{to{opacity:1}} @keyframes gfxOut{from{opacity:1}to{opacity:0}}
.gfx-text{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 16px;animation:gfxPop .6s cubic-bezier(.2,1.4,.4,1) var(--gd,0ms) both}
#goalfx.still .gfx-text{animation:none}
.gfx-goal{font-family:var(--mono);font-size:clamp(56px,16vw,120px);font-weight:600;color:var(--gold);letter-spacing:.04em;line-height:1}
.gfx-who{font-size:clamp(20px,5vw,30px);font-weight:700}
.gfx-min{font-size:14px;color:var(--muted)}
@keyframes gfxPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.gfx-burst{position:absolute;left:50%;top:50%;width:0;height:0}
.gfx-burst i{position:absolute;width:9px;height:9px;border-radius:2px;background:var(--c);opacity:0;animation:gfxDot 1.4s ease-out calc(var(--gd,0ms) + 120ms) forwards}
#goalfx.still .gfx-burst{display:none}
@keyframes gfxDot{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){ #goalfx .gfx-text,#goalfx .gfx-burst i{animation:none} }
.whistle{border-color:var(--fg)}
.whistle-lb{font-size:22px;font-weight:700;letter-spacing:.02em}
.whistle-lb::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fg);margin-right:8px;vertical-align:2px}
.clock.late{color:var(--danger);font-weight:600}
#app.fit{height:calc(100dvh - 20px);gap:10px}
#app.fit .board .sc{font-size:26px}
.scbox{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.scbox .clock{font-size:12px}
#app.fit .mgrid{flex:1;min-height:0;gap:14px}
.mside{display:flex;flex-direction:column;gap:12px;min-height:0}
#app.fit .situ{font-size:17px}
.runs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.runs-lb{font-size:12px;color:var(--muted);margin-right:2px;white-space:nowrap;flex:none}
.chip{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.choice.newopt{border-color:var(--accent);border-style:dashed}
.choice.newopt .lb::before{content:"새 선택지 · ";color:var(--accent);font-size:12px}
.field .opplbl{fill:var(--danger)}
.field .evline{stroke:var(--danger);stroke-width:.45;stroke-dasharray:1.4 1.1;fill:none}
.field .evcut{animation:evFade 3.2s ease forwards;animation-delay:.1s}
@keyframes evFade{0%{opacity:0}8%{opacity:1}72%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){ .field .evcut{animation:none;opacity:1} }
.field .runring{fill:none;stroke:var(--accent);stroke-width:.5;stroke-dasharray:1 .8}
.mfoot{display:flex;flex-direction:column;gap:8px;font-size:13px}
.logbox summary{cursor:pointer;color:var(--muted);font-size:13px}
.logbox .log{margin-top:8px}
#app.fit .pitchwrap .legend{font-size:11px;gap:8px}
@media (min-width:760px){
  #app.fit .mgrid{grid-template-columns:auto minmax(0,1fr)}
  #app.fit .pitchwrap{position:static;height:100%;min-height:0}
  #app.fit .field.v{height:calc(100dvh - 160px);max-height:640px;width:auto;max-width:none;aspect-ratio:74/111}
  .mside{overflow-y:auto;padding-right:4px}
}
@media (max-width:759px){
  #app.fit{height:auto;min-height:calc(100dvh - 20px)}
  #app.fit .field.h{width:100%;max-width:520px;height:auto;aspect-ratio:111/74;max-height:31dvh}
  .field.h .nm{font-size:3.3px;stroke-width:1.1px}
  .field.h .ps{font-size:2.1px}
  #app.fit .mgrid{gap:8px}
  #app.fit .mside{gap:8px}
  #app.fit .eyebrow{font-size:11px}
  .runs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{white-space:nowrap;flex:none}
  #app.fit .choice .sub{display:none}
  #app.fit .choice .pct small{display:inline;margin-left:4px}
  #app.fit .choice{grid-template-columns:1fr auto;padding:10px 12px}
  #app.fit .choice .pct{grid-row:1;font-size:16px}
  #app.fit .pitch{display:none}
  #app.fit .pitchwrap .legend{display:none}
  #app.fit .choices{gap:6px}
  #app.fit .choice{padding:8px 12px;gap:2px 10px}
  #app.fit .choice .lb{font-size:14px}
  #app.fit .choice .pct{font-size:17px}
  #app.fit .choice .sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app.fit .situ{font-size:16px}
  #app.fit .turn{font-size:13px}
  #app.fit .flashline{font-size:19px;padding:10px}
}
@media (max-width:420px){ .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))} .board .sc{font-size:28px} }
.turn p{animation:rise .35s ease both;animation-delay:calc(var(--i,0) * .52s)}
.after{animation:rise .35s ease both;animation-delay:var(--d,0s)}
.flashline{font-size:24px;animation:flashIn .4s ease both;animation-delay:var(--d,0s);padding:14px 16px;border-radius:8px;text-align:center}
.flashline.bad{color:var(--danger);background:var(--danger-soft)}
.flashline.ok{color:var(--accent);background:var(--accent-soft)}
.flashline.goal{color:var(--gold);background:var(--surface);border:1px solid var(--gold)}
@keyframes flashIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.choices.deciding .choice{opacity:.35;transition:opacity .25s}
.choices.deciding .choice.picked{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);animation:pick .42s ease}
@keyframes pick{0%{transform:scale(1)}40%{transform:scale(.985)}100%{transform:scale(1)}}
.sc.pop{animation:pop .6s ease .3s both}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25);color:var(--gold)}100%{transform:scale(1)}}
.sc{display:inline-block}
@media (prefers-reduced-motion:reduce){ .flashline{animation:none} .bump,.turn p,.after,.sc.pop,.choices.deciding .choice.picked{animation:none} }
</style>

<div id="app"></div>

<script>
(() => {

  const N = 1<<n, NEG = -1e9; let cur = new Array(N).fill(NEG); cur[0] = 0; const from = [];
  for(let i=0;i<n;i++){ const nd = new Array(N).fill(NEG), ch = new Array(N).fill(-1);

      pass('센터백에게 백패스',A('CB',s),'def',.96,.94),

      pass('윙어에게 찔러주기',A('W',s),'att',.78,.74),

      pass('센터백에게 백패스',A('CB',s),'def',.95,.93),

    case 'W': return zone==='box' ? [
      shot('각을 좁혀 슛',.66,.60),
      pass('스트라이커에게 컷백',A('ST',s),'box',.84,.80),

    case 'ST':
      if(zone==='air') return [

        pass('미드필더에게 머리로 떨궈주기',A('CM',s),'att',.74,.80)];
      if(zone==='box') return [
        shot('골문 구석으로 슛',.72,.64),
        shot('골키퍼 키를 넘기는 칩슛',.54,.74),

const tired = () => (m && m.half===2 && m.min>=70) ? 1 : 0;
function offRisk(a){
  if(a.kind!=='pass' || ROLE[a.to]!=='ST') return 0;
  let r = 0;
  if(a.toZone==='box') r = a.run ? .14 : .18;
  else if(/롱/.test(a.label)) r = .10;
  else return 0;
  return Math.max(.04, r - (P(a.from).s.pas/m.opp.ovr-1)*.12);
}
// probability: step 1 = sender, step 2 = receiver (or goalkeeper for shots)
const eff = (x,o,k) => k*(x-o)/o;   // advantage in percent of the opponent's level
function probs(a){
  const me = P(a.from).s, opp = m.opp.ovr * (1 + redPen()*1.7 + tired()*.12);
  if(a.kind==='pass') return [cl(a.b1+eff(me.pas,opp,.3)), cl(a.b2+eff(P(a.to).s.ctl,opp,.3))];
  if(a.kind==='dribble') return [cl(a.b1+eff(me[a.stat],opp,.35)), 1];
  return [cl(a.b1+eff(me.sho,opp,.3)), cl(a.b2+eff(me.sho,opp,.3))];
}

// ---------- defending: 3 stages (front press -> midfield -> last line) then goalkeeper ----------
const STAGE = {
  front:{name:'전방 압박', zone:'att', get list(){ return POS.filter(p=>ROLE[p]==='W'||ROLE[p]==='ST'); }, shift:-18,
    opts:[
      {label:'강하게 전방 압박', b:.42, win:'ball', fail:'next-', note:'성공하면 상대 진영에서 바로 역습, 실패하면 뒷공간이 열림'},
      {label:'패스길 막으며 물러서기', b:.74, win:'next+', fail:'next', note:'공은 못 뺏지만 다음 수비가 쉬워짐'},
      {label:'뒤에서 몸으로 끊기', b:.55, win:'ball', fail:'foul', note:'실패하면 파울, 경고 확률 40%'}]},
  mid:{name:'중원 수비', zone:'mid', get list(){ return [...slots('CDM'),...slots('CDM'),...slots('CM')]; }, shift:-8,
    opts:[
      {label:'패스 길목 인터셉트', b:.48, win:'ball', fail:'next-', note:'성공하면 중원에서 되찾고, 실패하면 수비 라인이 흔들림'},
      {label:'자리 지키며 지연', b:.74, win:'next+', fail:'next', note:'공은 못 뺏지만 수비 라인이 정비됨'},
      {label:'전술적 파울로 끊기', b:1, win:'tactical', fail:'tactical', note:'역습은 확실히 끊지만 경고 확률 65%'}]},
  back:{name:'최종 수비', zone:'def', get list(){ return [...slots('CB'),...slots('CB'),...slots('FB')]; }, shift:0,
    opts:[
      {label:'슬라이딩 태클', b:.60, win:'ball', fail:'foulbox', note:'성공하면 바로 뺏고, 실패하면 1대1 위기나 페널티킥'},
      {label:'버티며 지연 수비', b:.74, win:'long', fail:'normal', note:'성공해도 상대가 먼 거리에서 슛을 때림'},
      {label:'몸싸움으로 밀어내기', b:.52, win:'ball', fail:'normal', note:'성공하면 뺏고, 실패해도 큰 위기는 아님'}]}
};
const NEXT = {front:'mid', mid:'back'};
const GK_OPTS = [
  {label:'앞으로 나와 각 좁히기', mod:{'1v1':.18,normal:0,long:-.15,pen:-.06}},
  {label:'제자리에서 반응하기', mod:{'1v1':-.08,normal:.06,long:.10,pen:.03}},
  {label:'예측하고 먼저 몸 날리기', mod:{'1v1':.06,normal:.03,long:-.05,pen:.08}}];
const SHOT_BASE = {'1v1':.38,normal:.58,long:.74,pen:.15};
const SHOT_MISS = {'1v1':.12,normal:.25,long:.40,pen:.05};
const SHOT_TXT = {'1v1':'상대 공격수가 수비를 벗겨내고 골키퍼와 1대1!', normal:'상대가 박스 안에서 슛을 준비합니다.', long:'상대가 박스 밖에서 중거리 슛을 노립니다.', pen:'페널티킥! 상대 키커가 공 앞에 섭니다.'};
const redPen = () => (m && m.reds ? m.reds.length*.05 : 0);
const avail = p => !(m && m.reds && m.reds.includes(p));
const pickAvail = list => { const a = list.filter(avail); return a.length ? pick(a) : pick(POS.filter(p=>p!=='GK'&&avail(p))); };
const defProb = (o,pos) => o.b>=1 ? 1 : cl(o.b+eff(P(pos).s.def,m.opp.ovr,.38)+(m.defMod||0)-redPen()-tired()*.03-(m.stage==='back'?(m.expose||0):0));
const saveProb = (o,type) => cl(SHOT_BASE[type]+o.mod[type]+eff(P('GK').s.gk,m.opp.ovr,.35));

const rate = (p,d) => { if(m && m.rt && p) m.rt[p] = (m.rt[p]||0)+d; };
function say(t,k='info'){ m.turn.push({t,k}); m.log.unshift({t,k,min:Math.min(m.min,90+(m.min>90?m.min-90:0))}); }

function flash(t,k){ if(!m.fq) m.fq=[]; m.fq.push({t,k}); m.flash = REDUCED ? {t,k} : m.fq[0]; }
// who steals the ball depends on where it happens: never an opposing centre-back deep in our own half
function oppRole(z){ z = z==='air' ? 'box' : z; return z==='def' ? '상대 공격수' : z==='mid' ? '상대 미드필더' : '상대 수비수'; }
function lostBall(a, atReceiver){
  const z = atReceiver ? a.toZone : m.zone, role = oppRole(z);
  const f = formation(), A = f[a.from], B = a.to && f[a.to] ? f[a.to] : null;
  let spot;
  if(B) spot = atReceiver ? [B[0]*.75+A[0]*.25, B[1]*.75+A[1]*.25] : [A[0]*.6+B[0]*.4, A[1]*.6+B[1]*.4];
  else spot = [A[0], Math.max(9, A[1]-5)];
  m.ev = {from:a.from, to:B?a.to:null, spot, who:role};
  return role;
}
const RUNS = {
  overL:{fb:'LB', label:()=>`${tag('LB')} 오버래핑`},
  overR:{fb:'RB', label:()=>`${tag('RB')} 오버래핑`},
  stRun:{label:()=>`${tag('ST')} 뒷공간 침투`}};
function runsFor(){
  if(m.mode!=='attack' || !['mid','att'].includes(m.zone)) return [];
  return Object.keys(RUNS).filter(k=>{ const p = k==='stRun'?'ST':RUNS[k].fb; return p!==m.holder && avail(p) && !(k==='stRun'&&m.zone==='att'&&ROLE[m.holder]==='W'&&false); });
}
function refreshActions(){
  const base = m.baseActions.slice();
  if(m.run==='overL'||m.run==='overR'){ const fb=RUNS[m.run].fb; base.unshift({...pass(`오버래핑한 ${fb==='LB'?'왼쪽':'오른쪽'} 풀백에게 패스`,fb,'att',.88,.88), from:m.holder, run:true}); }
  if(m.run==='stRun'){ base.unshift({...pass('침투하는 스트라이커에게 스루패스','ST','box',.76,.72), from:m.holder, run:true}); }
  m.actions = base;
}
function setHolder(pos, zone, line){
  m.mode='attack'; m.holder=pos; m.zone=zone; m.run=null; m.expose=0;
  const seen = new Set();
  m.baseActions = actionsFor(pos,zone).filter(a=>!a.to||avail(a.to)).filter(a=>{ if(a.kind!=='pass') return true; if(seen.has(a.to)) return false; seen.add(a.to); return true; }).map(a=>({...a, from:pos}));
  refreshActions();
  m.situ = line || `${who(pos)}${josa(nm(pos),'이','가')} 공을 잡았습니다.`;
}

function startMatch(promo){
  if(promo && !promoReady()) promo = false;
  m = {opp:nextOpp(promo), promo:!!promo, rt:{}, goals:{}, lastPass:null, us:0, them:0, min:0, half:1, log:[], turn:[], scorers:[], mode:'attack', cards:{}, reds:[], defMod:0, shots:0, oppShots:0};
  say(promo ? `승격전 킥오프! ${tn()} 대 ${m.opp.name}. 이기면 승격합니다.` : `킥오프! ${tn()} 대 ${m.opp.name}.`);
  setHolder('LCM','mid',`킥오프 직후, ${who('LCM')}${josa(nm('LCM'),'이','가')} 공을 받았습니다.`);
  view='match'; render();
}

function oppAttack(from){
  m.lastPass = null;
  m.min += ri(1,2); m.defMod = 0;
  if(m.run==='overL'||m.run==='overR'){ m.expose=.1; say(`${tag(RUNS[m.run].fb)}${josa(nm(RUNS[m.run].fb),'이','가')} 올라가 있어 수비 뒷공간이 비었습니다!`,'bad'); }
  m.run=null;
  const own = save.team.reduce((a,t)=>a+ovr(t),0)/11;
  if(R() < cl(.14 + (own/m.opp.ovr-1)*.36 + tired()*.04, .04, .3)){
    const w = pickAvail([...slots('CDM'),...slots('CM')]);
    say(`${m.opp.name}의 패스 실수! ${tag(w)}${josa(nm(w),'이','가')} 공을 줍습니다.`,'ok');
    flash(`상대의 패스가 흐르며 ${tag(w)}${josa(nm(w),'이','가')} 공을 되찾았습니다!`,'ok');
    setHolder(w,'mid'); return;
  }
  defStage({def:'back', mid:'mid', kick:'mid', att:'front', box:'front', air:'front'}[from]);
}

function defStage(st){
  const d = pickAvail(STAGE[st].list), j = josa(nm(d),'이','가');
  m.mode='defend'; m.stage=st; m.cb=d; m.oppWho = {front:'상대 수비수', mid:'상대 미드필더', back:'상대 공격수'}[st];
  m.situ = {front:`상대 수비수가 후방에서 빌드업을 시작합니다. ${who(d)}${j} 압박할 수 있는 거리에 있습니다.`,
    mid:`상대 미드필더가 중원으로 공을 몰고 옵니다. ${who(d)}${j} 앞을 막아섭니다.`,
    back:`상대 공격수가 박스 앞까지 들어옵니다. ${who(d)}${j} 마지막으로 막아섭니다.`}[st];
}

function card(pos, chance){
  if(R()>=chance) return;
  m.cards[pos] = (m.cards[pos]||0)+1; rate(pos, m.cards[pos]>=2 ? -1.5 : -.5);
  if(m.cards[pos]>=2){ m.reds.push(pos); say(`${tag(pos)} 경고 누적 퇴장! 남은 경기를 10명으로 뜁니다.`,'them'); }
  else say(`${tag(pos)}에게 옐로카드.`,'bad');
}

function gkMoment(type){
  m.mode='gk'; m.shotType=type; m.oppShots++; m.oppWho='상대 공격수';
  m.situ = `${SHOT_TXT[type]} ${tag('GK')}, 어떻게 막을까요?`;
}

function doAttack(i){
  const a = m.actions[i]; const [p1,p2] = probs(a);
  if(a.kind==='pass'){
    m.min += ri(2,3);
    const off = offRisk(a);
    if(off && R()<off){
      rate(a.to,-.3); say(`오프사이드! ${tag(a.to)}${josa(nm(a.to),'이','가')} 수비 라인보다 앞서 있었습니다.`,'bad');
      flash('오프사이드!','bad');
      say('상대 프리킥으로 재개합니다.'); oppAttack('att'); return;
    }
    if(R()<p1){
      if(R()<p2){
        rate(a.from,.05); m.lastPass = {from:a.from, to:a.to};
        say(a.toZone==='air' ? `${tag(a.from)}의 크로스가 정확히 날아갑니다. ${tag(a.to)}${josa(nm(a.to),'이','가')} 공중볼 경합에 뛰어듭니다.`
          : `${tag(a.from)} → ${tag(a.to)}, ${a.label} 성공.`,'ok');
        setHolder(a.to, a.toZone, a.toZone==='air' ? `크로스가 문전으로! ${NOUN[a.to]} ${tag(a.to)}, 선택하세요.` : null);
      } else {
        const role = lostBall(a, true); rate(a.to,-.25);
        say(pick([`패스는 정확했지만 ${tag(a.to)}의 트래핑이 길어졌고, ${role}가 공을 가로챕니다.`,`좋은 패스였지만 ${tag(a.to)}${josa(nm(a.to),'이','가')} 받기 직전, ${role}가 가로챕니다.`]),'bad');
        flash(`${role}가 ${tag(a.to)}에게 가던 공을 끊었습니다!`,'bad');
        oppAttack(a.toZone);
      }
    } else {
      const role = lostBall(a, false); rate(a.from,-.3);
      say(`${tag(a.from)}의 ${a.label}, ${role}가 길목에서 끊어냅니다.`,'bad');
      flash(`${tag(a.from)}의 패스를 ${role}가 끊었습니다!`,'bad');
      oppAttack(m.zone);
    }
  } else if(a.kind==='dribble'){
    m.min += ri(1,3);
    if(R()<p1-tired()*.03){ rate(a.from,.2); say(`${tag(a.from)}, ${a.label} 성공! ${ZONE_KO[a.toZone]}${josa(ZONE_KO[a.toZone],'으로','로')} 들어갑니다.`,'ok'); setHolder(a.from, a.toZone); }
    else { rate(a.from,-.3); say(`${tag(a.from)}${josa(nm(a.from),'이','가')} ${(()=>{ const role=lostBall(a,false); return role; })()}에게 막혀 공을 빼앗깁니다.`,'bad'); flash(`${tag(a.from)}${josa(nm(a.from),'이','가')} ${m.ev.who}에게 공을 빼앗겼습니다!`,'bad'); oppAttack(m.zone); }
  } else {
    m.min += ri(1,2); m.shots++;
    if(R()<p1){
      if(R()<p2){
        m.us++; rate(a.from,1.3); if(m.lastPass && m.lastPass.to===a.from && m.lastPass.from!==a.from) rate(m.lastPass.from,.8); m.lastPass = null;
        m.scorers.push(`${tag(a.from)} ${Math.min(m.min,90)}'`);
        say(`골! ${tag(a.from)}의 ${a.label}이 골망을 흔듭니다!`,'goal');
        say(`${m.opp.name}의 킥오프로 경기가 다시 시작됩니다.`); m.fx={who:tag(a.from), min:Math.min(m.min,90)};
        oppAttack('kick');
      } else { say(`${tag(a.from)}의 ${a.label}, 골키퍼 선방에 막힙니다!`,'bad'); flash('상대 골키퍼의 선방!','bad'); oppAttack('box'); }
    } else { rate(a.from,-.2); say(`${tag(a.from)}의 ${a.label}이 골대를 벗어납니다.`,'bad'); flash('슛이 빗나갔습니다.','bad'); oppAttack('box'); }
  }
}

function doDefend(i){
  const S = STAGE[m.stage], o = S.opts[i], d = m.cb, j = josa(nm(d),'이','가');
  const p = defProb(o,d); m.defMod = 0; m.min += 1;
  if(o.win==='tactical'){
    rate(d,-.2); say(`${tag(d)}의 전술적 파울! 상대 역습을 끊습니다.`,'bad'); card(d,.45);
    say('상대 프리킥. 그 사이 우리 수비가 자리를 잡습니다.'); m.defMod = .08; defStage('back'); return;
  }
  if(R()<p){
    if(o.win==='ball'){ rate(d,.7); say(`${tag(d)}의 ${o.label} 성공! 공을 되찾습니다.`,'ok'); flash(`${tag(d)}${josa(nm(d),'이','가')} 공을 되찾았습니다!`,'ok'); setHolder(d, S.zone); }
    else if(o.win==='next+'){ rate(d,.25); say(`${tag(d)}${j} 상대의 속도를 늦춥니다. 다음 수비가 쉬워집니다.`,'ok'); m.defMod = .08; defStage(NEXT[m.stage]); }
    else { rate(d,.2); say(`${tag(d)}${j} 끝까지 버텨 슈팅 각을 막습니다.`,'ok'); gkMoment('long'); }
    return;
  }
  if(o.fail==='next-'){ rate(d,-.35); say(`${tag(d)}${j} 벗겨집니다! 수비 뒷공간이 열립니다.`,'bad'); m.defMod = -.08; defStage(NEXT[m.stage]); }
  else if(o.fail==='next'){ rate(d,-.25); say(`상대가 ${tag(d)}${josa(nm(d),'을','를')} 지나 전진합니다.`,'bad'); defStage(NEXT[m.stage]); }
  else if(o.fail==='foul'){ rate(d,-.4); say(`${tag(d)}의 파울. 상대가 프리킥으로 다시 시작합니다.`,'bad'); card(d,.25); defStage(NEXT[m.stage]); }
  else if(o.fail==='foulbox'){
    if(R()<.3){ rate(d,-.8); say(`${tag(d)}의 태클이 상대 다리에 걸립니다. 페널티킥!`,'them'); card(d,.5); gkMoment('pen'); }
    else { rate(d,-.5); say(`${tag(d)}의 태클이 빗나갑니다!`,'bad'); gkMoment('1v1'); }
  }
  else { rate(d,-.4); say(`${tag(d)}${j} 상대에게 벗겨집니다.`,'bad'); gkMoment('normal'); }
}

function doGK(i){
  const o = GK_OPTS[i], type = m.shotType; m.min += 1;
  if(R()<SHOT_MISS[type]){ say(type==='pen'?`상대 키커의 슛이 골대를 벗어납니다!`:`상대의 슛이 골대를 벗어납니다. 골킥.`,'ok'); setHolder('GK','def'); return; }
  if(R()<saveProb(o,type)){ rate('GK', type==='pen'?1:.7); say(`${tag('GK')}의 선방! 공을 잡아냅니다.`,'ok'); setHolder('GK','def'); }
  else {
    m.them++; rate('GK',-.35); say(`실점. ${m.opp.name}의 골이 들어갑니다.`,'them'); flash('실점했습니다.','bad');
    const k = pickAvail([...slots('CM'),...slots('CDM')]);
    setHolder(k,'mid',`우리 팀 킥오프. ${who(k)}${josa(nm(k),'이','가')} 공을 받았습니다.`);
  }
}

function choose(i){
  m.turn = []; m.flash = null; m.fq = []; m.ev = null; m.fx = null; confirmReset=false;
  if(m.mode==='attack') doAttack(i); else if(m.mode==='defend') doDefend(i); else if(m.mode==='gk') doGK(i);
  if(m.mode==='attack' || m.mode==='defend'){
    if(m.half===1 && m.min>=45){
      m.min=45; say(`전반 종료 휘슬. ${m.us}:${m.them}로 전반을 마칩니다.`); m.mode='half';
    } else if(m.min>=90){ finish(); }
  }
  render();
}

function secondHalf(){
  m.turn=[]; m.flash=null; m.fq=[]; m.ev=null; m.half=2; m.min=45;
  say('후반 시작! 상대 킥오프로 시작합니다.');
  oppAttack('kick'); render();
}
function finish(){
  m.mode='end'; m.min=Math.max(90,m.min);
  const res = m.us>m.them?'w':m.us===m.them?'d':'l', L = save.league, f = fOf(L);
  let reward = Math.round(({w:15,d:9,l:5}[res] + m.us*3) * cOf(L) * COIN_K);
  m.res = res;
  if(m.promo){
    if(res==='w'){ reward *= 2; if(L>1){ save.league = L-1; save.lRound = 0; save.cool = 0; m.promoRes = 'up'; } else { save.champ = true; m.promoRes = 'champ'; } }
    else { save.cool = PROMO_COOL; m.promoRes = 'fail'; }
  } else { save.lRound++; if(save.cool>0) save.cool--; }
  m.reward = reward;
  save.coins += reward; save[res]++; save.gf += m.us; save.ga += m.them;
  // player ratings for this match (base 6.0), kept for the last 5 matches
  m.rating = {}; let best = null;
  for(const t of save.team){ const p = t.pos; let d = m.rt[p]||0;
    d += res==='w' ? .3 : res==='l' ? -.2 : 0;
    if(m.them===0){ const r = ROLE[p]; if(r==='GK') d += .5; else if(r==='CB'||r==='FB') d += .3; }
    const r = Math.max(3, Math.min(10, Math.round((6+d)*10)/10)); m.rating[p] = r;
    t.hist.push(r); if(t.hist.length>5) t.hist.shift();
    if(!best || r>m.rating[best]) best = p; }
  m.mvp = best;
  say('경기 종료.');
  persist();
}

const SHIFT = {def:0, mid:-10, att:-22, box:-28, air:-28};
let lastPos = null;
const horiz = () => matchMedia('(max-width: 759px)').matches;
const T = ([x,y],h) => h ? [105-y, x] : [x,y];
function formation(){
  const sh = !m ? 0 : m.mode==='attack' ? (SHIFT[m.zone]||0) : m.mode==='defend' ? STAGE[m.stage].shift : 0, out = {};
  for(const p of POS){ const [x,y]=BASE[p]; const k = p==='GK'?0.12 : (ROLE[p]==='CB'||ROLE[p]==='FB')?0.8:1; out[p]=[x, Math.max(9,y+sh*k)]; }
  if(m && m.mode==='attack'){
    const h=m.holder, r=ROLE[h], hx=BASE[h][0], cdm=slots('CDM')[0];
    if(m.zone==='box'||m.zone==='air'){
      if(r==='ST') out[h]=[Math.abs(hx-34)<4?34:(hx<34?29:39), m.zone==='air'?12:16];
      else if(r==='W'||r==='FB') out[h]=[sideOf(h)==='L'?19:49,15];
    } else if(r==='FB' && m.zone==='att') out[h]=[sideOf(h)==='L'?6:62, 30];
    // overlap: the winger (or the wide central midfielder) tucks inside, the full-back runs past on the outside and a bit ahead
    for(const [key,sd] of [['overL','L'],['overR','R']]){ if(m.run!==key) continue;
      const fb=RUNS[key].fb, w=sideSlot('W',sd)||sideSlot('CM',sd);
      if(w && w!==fb){ const wy=out[w][1]; out[w]=[sd==='L'?22:46, wy]; out[fb]=[sd==='L'?6:62, Math.max(12, wy-7)]; }
      else out[fb]=[sd==='L'?6:62, Math.max(12, out[fb][1]-14)]; }
    if(m.run==='stRun') out.ST=[BASE.ST[0], m.zone==='mid'?24:14];
    const side = sideOf(h), far = side==='L'?'R':side==='R'?'L':null;
    // build-up from the back: the holding midfielder drops between the centre-backs, full-backs push up
    if(m.zone==='def' && !m.run){
      const cbs = slots('CB');
      if(cbs.length===2) for(const p of cbs) out[p]=[BASE[p][0]<34?20:48, 86];
      if(cdm) out[cdm]=[BASE[cdm][0], h===cdm?76:80];
      for(const p of slots('FB')) out[p]=[BASE[p][0], BASE[p][1]-11];
    }
    // rest defence: while we attack, the far-side full-back tucks in and the holding midfielder stays back
    if((m.zone==='att'||m.zone==='box'||m.zone==='air') && !m.run){
      if(far){ const fb=sideSlot('FB',far); if(fb && h!==fb) out[fb]=[far==='L'?20:48, 66]; }
      if(cdm && h!==cdm) out[cdm]=[BASE[cdm][0], 66];
    }
    // box crashers: far-side winger to the far post, a midfielder arriving at the edge of the box
    if(m.zone==='box'||m.zone==='air'){
      if(far){ const w=sideSlot('W',far); if(w && h!==w) out[w]=[far==='L'?24:44, 17]; }
      if(h==='LCM'||h==='RCM'){ const o=h==='LCM'?'RCM':'LCM'; if(ROLE[o]==='CM') out[o]=[o==='LCM'?25:43, 32]; }
      else { const cm = side==='L'?'RCM':'LCM'; if(ROLE[cm]==='CM') out[cm]=[cm==='LCM'?25:43, 32]; }
    }
  }
  return out;
}
function fieldLines(h){

function playerG(p,[x,y],opts={}){
  const t=P(p), has=opts.holder===p, off=!!(m&&opts.live&&m.reds.includes(p)), yc=!!(m&&opts.live&&m.cards[p]===1);
  const label = off ? `${t.name} 퇴장` : opts.ovr ? `${t.name} ${ovr(t)}` : t.name;
  return `<g class="pl-g ${has?'has':''} ${opts.mark===p?'mark':''} ${opts.run===p?'runner':''} ${off?'off':''}" data-p="${p}" ${opts.jump?`data-jump="${p}" role="button" tabindex="0" aria-label="${esc(t.name)} 카드로 이동"`:''} style="transform:translate(${x}px,${y}px)">

}
function matchPositions(h){ const f=formation(), o={}; for(const p of POS) o[p]=T(f[p],h); return o; }
function matchField(){
  const h = horiz(), pos = matchPositions(h), start = (lastPos && lastPos.h===h) ? lastPos.pos : pos;
  let extra = '';
  if(m.mode==='attack'){
    if(m.zone==='air'){ const [bx,by]=T([38,7.5],h); extra = `<circle class="ball" cx="${bx}" cy="${by}" r="1.3"/>`; }
  } else {
    const f = formation();
    let ox = 34, oy = {'1v1':91, normal:84, long:73, pen:94}[m.shotType];
    if(m.mode==='defend'){ const [dx,dy] = f[m.cb]; ox = Math.min(62,Math.max(6,dx+(dx<34?5:-5))); oy = dy-6.5; }
    const [X,Y] = T([ox,oy],h);
    extra = `<g class="pl-g" style="transform:translate(${X}px,${Y}px)"><circle class="opp" r="3.1"/><text class="ps" y=".1">상대</text><text class="nm opplbl" y="5.3">${esc(m.oppWho||'상대 공격수')}</text><circle class="ball" cx="3.4" cy="-2.6" r="1.3"/></g>`;
  }

  if(m.ev){

    evSvg = `<g class="evcut">${B?`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" class="evline"/>`:''}
      <g transform="translate(${sx} ${sy})"><circle class="opp" r="2.7"/><path d="M-1.2 -1.2 L1.2 1.2 M1.2 -1.2 L-1.2 1.2" stroke="var(--bg)" stroke-width=".7" stroke-linecap="round"/><text class="nm opplbl" y="-4.6">${esc(m.ev.who)}</text></g></g>`;
  }
  const runner = m.run ? (m.run==='stRun'?'ST':RUNS[m.run].fb) : null;
  const g = POS.map(p=>playerG(p,start[p],{holder:m.mode==='attack'?m.holder:null, ball:m.zone!=='air', live:true, run:runner, mark:m.mode==='defend'?m.cb:m.mode==='gk'?'GK':null})).join('');
  return `<div class="pitchwrap"><svg class="field ${h?'h':'v'}" viewBox="${h?'-3 -3 111 74':'-3 -3 74 111'}" role="img" aria-label="경기장, 선수 위치">${fieldLines(h)}${g}${extra}${evSvg}</svg>

}

  const eyebrow = m.mode==='attack' ? `공격 · ${ZONE_KO[m.zone]} · ${m.holder}${m.run&&m.run!=='stRun'?' · 윙어는 안쪽으로, 풀백은 바깥으로 · 공을 뺏기면 수비 뒷공간이 빔':''}` : m.mode==='defend' ? `수비 · ${STAGE[m.stage].name} · ${m.cb}${m.defMod>0?' · 수비 정비됨 +8%':m.defMod<0?' · 뒷공간 열림 -8%':''}${m.stage==='back'&&m.expose?' · 풀백 자리 비어 있음 -10%':''}` : '골키퍼 · 슈팅 위기';

function render(){
  app.className = (view==='home'||view==='club') ? '' : view==='match' ? 'wide fit' : 'wide';
  document.body.classList.toggle('fitbody', view==='match');
  app.innerHTML = view==='home'?renderHome():view==='squad'?renderSquad():view==='club'?renderClub():renderMatch();

function jumpTo(p){ openPos=p; render(); const el=document.getElementById('card-'+p); if(!el) return; el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

app.addEventListener('click', e=>{
  const j = e.target.closest('[data-jump]'); if(j){ jumpTo(j.dataset.jump); return; }
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.run){ if(Date.now()<lockUntil||!m||m.mode!=='attack') return; m.run = m.run===b.dataset.run ? null : b.dataset.run; refreshActions(); m.turn=[]; m.flash=null; m.fq=[]; m.ev=null; render(); return; }
  if(b.dataset.form){ if(m && m.mode!=='end') return; setForm(b.dataset.form); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.open){ const p=b.dataset.open; openPos = openPos===p ? null : p; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.go){ view=b.dataset.go; confirmReset=false; if(view!=='match') m = (m&&m.mode==='end')?null:m; render(); window.scrollTo(0,0); return; }
  if(b.dataset.choice!==undefined){
    if(Date.now()<lockUntil) return;
    const i=+b.dataset.choice; lockUntil=Date.now()+60000;
    b.classList.add('picked'); b.parentElement.classList.add('deciding');
    setTimeout(()=>{ const before=m.us+m.them; choose(i); const nfl = (m.fq?m.fq.length:0), wait=Math.max((m.turn?m.turn.length:0)*STEP + (STEP?nfl*FLASH:0), fxHold()); lockUntil=Date.now()+wait;
      if(STEP && nfl>1) for(let q=1;q<nfl;q++) setTimeout(()=>{ const el=document.querySelector('.flashline'); if(el){ el.className=`situ flashline ${m.fq[q].k}`; el.style.animation='none'; void el.offsetWidth; el.style.animation=''; el.textContent=m.fq[q].t; } }, (m.turn.length*STEP) + q*FLASH);
      if(m.fx) showGoalFx(m.fx, FX_IN);
      if((m.flash||m.fx)&&STEP) setTimeout(()=>{ const fl=document.querySelector('.flashline'), nx=document.getElementById('next-situ'); if(fl) fl.remove(); if(nx) nx.hidden=false; }, wait);
      if(m.us+m.them!==before){ const sc=document.querySelector('.sc'); if(sc) sc.classList.add('pop'); } }, REDUCED?0:420);
    return; }
  if(b.dataset.item){ if(buyItem(b.dataset.item)){ const y=window.scrollY; render(); window.scrollTo(0,y); } return; }
  if(b.dataset.sell){ confirmSell=b.dataset.sell; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.sellYes){ sell(b.dataset.sellYes); confirmSell=null; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.sellNo){ confirmSell=null; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.up){ const [p,k]=b.dataset.up.split(':'); const t=P(p), c=cost(t.s[k]);
    if(upgrade(p,k)){ const y=window.scrollY; render(); window.scrollTo(0,y);
      const el=document.getElementById(`st-${p}-${k}`); if(el) el.classList.add('bump'); } return; }
  const act=b.dataset.act;
  if(act==='start') startMatch();
  if(act==='start-promo') startMatch(true);
  if(act==='invest'){ if(investCV()){ const y=window.scrollY; render(); window.scrollTo(0,y); } return; }
  if(act==='second-half' && m && m.mode==='half' && Date.now()>=lockUntil) secondHalf();
  if(act==='reset'){ confirmReset=true; render(); }
  if(act==='copy'){ const t=document.getElementById('save-code'), msg=document.getElementById('code-msg');
    const done=()=>{ msg.textContent='복사했습니다.'; };
    try { navigator.clipboard.writeText(t.value).then(done,()=>{ t.select(); msg.textContent='코드가 선택되었습니다. 길게 눌러 복사하세요.'; }); }
    catch(err){ t.select(); msg.textContent='코드가 선택되었습니다. 길게 눌러 복사하세요.'; } }
  if(act==='load'){ const msg=document.getElementById('code-msg');
    try { save=normSave(importCode(document.getElementById('load-code').value)); applyForm(save.form); persist(); render(); }
    catch(err){ msg.textContent='코드를 읽지 못했습니다. 처음부터 끝까지 빠짐없이 붙여 넣었는지 확인해 주세요.'; msg.style.color='var(--danger)'; } }
  if(act==='reset-no'){ confirmReset=false; render(); }
  if(act==='quit-yes'){ m=null; view='home'; confirmReset=false; render(); window.scrollTo(0,0); }
  if(act==='reset-yes'){ save=newSave(); applyForm('433'); persist(); confirmReset=false; render(); }
});
app.addEventListener('keydown', e=>{ const j=e.target.closest&&e.target.closest('[data-jump]'); if(j&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); jumpTo(j.dataset.jump); } });
app.addEventListener('change', e=>{
  if(e.target.dataset && e.target.dataset.team){ const v=e.target.value.trim().slice(0,14); if(v){ save.teamName=v; persist(); } else e.target.value=tn(); return; }
  const p = e.target.dataset && e.target.dataset.name; if(!p) return;
  const v = e.target.value.trim().slice(0,8); if(v){ P(p).name=v; persist(); } else e.target.value=P(p).name;
});

render();
})();
</script>

</body></html>
